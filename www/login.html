<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - More than brows</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">

    <main class="modal__content" role="main">
        <header style="text-align: center; margin-bottom: 32px;">
            <h1 style="color: var(--color-primary); font-weight: 300;">More than Brows</h1>
            <p>Sistema de Gestión</p>
        </header>
        
        <form id="loginForm" class="form">
            <div class="form__group">
                <label for="email" class="form__label">Correo Electrónico</label>
                <input type="email" id="email" class="form__input" value="juan.garcia@email.com" required aria-required="true">
            </div>
            
            <div class="form__group">
                <label for="password" class="form__label">Contraseña</label>
                <input type="password" id="password" class="form__input" value="123456" required aria-required="true">
            </div>
            
            <button type="submit" class="btn btn--primary btn--block">Iniciar Sesión</button>
        </form>

        <div id="errorMsg" role="alert" aria-live="assertive" style="color: var(--color-danger); margin-top: 16px; display: none; text-align: center;">
            Usuario o contraseña incorrectos.
        </div>
    </main>

    <script>
        const API_URL = 'http://localhost:5044/api'; 

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const errorMsg = document.getElementById('errorMsg');
            
            try {
                // Login simulado buscando usuario activo
                const response = await fetch(`${API_URL}/Cliente?filtroEstadoActivo=true`);
                const clientes = await response.json();
                
                const usuario = clientes.find(c => c.email === email);

                if (usuario) {
                    localStorage.setItem('user', JSON.stringify(usuario));
                    window.location.href = 'admin.html';
                } else {
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error(error);
                errorMsg.textContent = "Error de conexión con el servidor.";
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
