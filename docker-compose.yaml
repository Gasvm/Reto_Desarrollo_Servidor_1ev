version: '3.9'

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    ports:
      - "7068:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=AlejandroPonnosUn10(!)
      - MSSQL_PID=Express
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - backend
    restart: unless-stopped

  api:
    image: gsvmm/reto-desarrollo-api:latest
    container_name: dotnet_api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8607:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__SistemaPedidosDB=Server=sqlserver,1433;Database=SistemaPedidosDB;User Id=sa;Password=AlejandroPonnosUn10(!);TrustServerCertificate=True;
      - APP_NAME=Sistema de Gestión - More Than Brows
    depends_on:
      - sqlserver
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  sqlserver_data: